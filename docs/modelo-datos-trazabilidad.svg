  <line x1="570" y1="168" x2="694" y2="245" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="588" y="198" width="106" height="16" fill="#FFFFFF"/>
  <text x="641" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">productoTerminado</text>

