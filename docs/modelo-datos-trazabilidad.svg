  <text x="417" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E293B">nombre</text>
  <text x="417" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E293B">precio</text>

  <!-- LotesProveedor -->
  <g filter="url(#softShadow)"><rect x="70" y="248" width="280" height="200" rx="10" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="1"/></g>
  <rect x="70" y="252" width="6" height="192" fill="#1E3A5F"/>
  <text x="92" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">LotesProveedor</text>
