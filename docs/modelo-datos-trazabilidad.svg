  <text x="92" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E293B">fechaRecepcion <tspan fill="#94A3B8">: Date</tspan></text>
  <text x="92" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1E293B">fechaCaducidad <tspan fill="#94A3B8">: Date</tspan></text>
  <text x="92" y="430" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#94A3B8">+ cuid, managed</text>

