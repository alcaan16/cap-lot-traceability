  <g filter="url(#softShadow)"><rect x="360" y="520" width="280" height="130" rx="10" fill="#FFFBF2" stroke="#F0D9A8" stroke-width="1"/></g>
  <rect x="360" y="524" width="6" height="122" fill="#C2760F"/>
  <text x="382" y="546" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C2760F">ConsumosLote</text>
