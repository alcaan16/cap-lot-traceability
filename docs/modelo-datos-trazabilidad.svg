  <!-- Proveedores (contexto) -->
  <g filter="url(#softShadow)"><rect x="70" y="90" width="210" height="78" rx="10" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="1"/></g>
  <rect x="70" y="94" width="6" height="70" fill="#64748B"/>
  <text x="92" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748B">Proveedores</text>
  <line x1="92" y1="124" x2="262" y2="124" stroke="#E2E8F0" stroke-width="1"/>
