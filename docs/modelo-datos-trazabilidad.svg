  <line x1="300" y1="448" x2="418" y2="517" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="306" y="472" width="92" height="16" fill="#FFFFFF"/>
  <text x="352" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">loteProveedor</text>
  <text x="300" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A5F">1</text>
  <text x="420" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#C2760F">N</text>

  <line x1="700" y1="448" x2="582" y2="517" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="592" y="472" width="70" height="16" fill="#FFFFFF"/>
  <text x="627" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">origenes</text>
  <text x="700" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A5F">1</text>
  <text x="580" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#C2760F">N</text>

  <text x="500" y="672" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#92621A">el rastro completo: qu&#233; lotes de proveedor componen cada lote interno</text>

  <!-- Leyenda -->
  <circle cx="330" cy="700" r="5" fill="#1E3A5F"/>
  <text x="342" y="704" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">entidad n&#250;cleo</text>
  <circle cx="470" cy="700" r="5" fill="#64748B"/>
